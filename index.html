<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wizzleflow — Professional Flowchart Maker</title>
    <meta name="description" content="Create beautiful flowcharts, diagrams, and process maps with Wizzleflow. A professional, browser-based editor with real-time collaboration, AI generation, and export to PNG, SVG, and PDF." />
    <meta name="keywords" content="flowchart maker, diagram editor, process map, workflow builder, flowchart tool, free flowchart" />
    <meta name="author" content="Wizzleflow" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Google Fonts Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Space+Grotesk:wght@300..700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wizzleflow — Professional Flowchart Maker" />
    <meta property="og:description" content="Create beautiful flowcharts, diagrams, and process maps instantly. No download required." />
    <meta property="og:url" content="https://wizzleflow.app" />
    <meta property="og:site_name" content="Wizzleflow" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wizzleflow — Professional Flowchart Maker" />
    <meta name="twitter:description" content="Create beautiful flowcharts, diagrams, and process maps instantly. No download required." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect to external services -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root">
      <!-- Fast Inline Preloader (Overwritten automatically when React loads) -->
      <style>
        body { margin: 0; background-color: #f6f1e9; }
        .initial-loader {
          position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          background-color: #f6f1e9; z-index: 99999;
        }
        .spinner-ring {
          width: 50px; height: 50px;
          border: 4px solid rgba(99, 102, 241, 0.2);
          border-top-color: #4f46e5;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div class="initial-loader">
        <div class="spinner-ring"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
